[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "superai-review"
version = "0.1.0"
description = "Multi-model review and synthesis platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "pillow>=10,<13",
  "PyJWT[crypto]>=2.10,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "pymupdf>=1.24,<2",
  "pypdf>=5,<7",
  "pytesseract>=0.3.13,<1",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/superai_review"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
